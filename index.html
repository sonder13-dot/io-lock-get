<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طقس العراق</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00c6ff);
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .location-button {
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .location-button:hover {
            background: rgba(255,255,255,0.35);
        }

        .main-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .city-selector {
            margin-bottom: 30px;
        }

        select {
            width: 100%;
            max-width: 350px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .city-name {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .date {
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .temperature {
            font-size: 75px;
            font-weight: bold;
        }

        .condition {
            font-size: 22px;
            margin-top: 10px;
        }

        .weather-icon {
            font-size: 100px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        .detail-card {
            background: rgba(255,255,255,0.14);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        .detail-title {
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 20px;
            font-weight: bold;
        }

        .location-info {
            margin-top: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.1);
            border-radius: 12px;
            display: none;
            font-size: 14px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }

        .error {
            margin-top: 20px;
            background: rgba(255,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            opacity: 0.7;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .weather-main {
                flex-direction: column;
                text-align: center;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .temperature {
                font-size: 60px;
            }

            .weather-icon {
                font-size: 80px;
            }

            .main-card {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>

        <div class="logo">
            🌤️ طقس العراق
        </div>

        <button class="location-button" onclick="getMyLocation()">
            📍 استخدام موقعي
        </button>

    </header>


    <div class="main-card">

        <div class="city-selector">

            <select id="citySelect" onchange="loadCityWeather()">

                <option value="33.3152,44.3661,Baghdad,بغداد">
                    بغداد
                </option>

                <option value="30.5085,47.7804,Basra,البصرة">
                    البصرة
                </option>

                <option value="36.1911,44.0092,Erbil,أربيل">
                    أربيل
                </option>

                <option value="36.3350,43.1189,Mosul,الموصل">
                    الموصل
                </option>

                <option value="32.0000,44.3333,Najaf,النجف">
                    النجف
                </option>

                <option value="32.6160,44.0249,Karbala,كربلاء">
                    كربلاء
                </option>

                <option value="31.9889,44.9250,Diwaniyah,الديوانية">
                    الديوانية
                </option>

                <option value="32.7500,44.6333,Hillah,الحلة">
                    الحلة
                </option>

                <option value="34.6100,43.6793,Kirkuk,كركوك">
                    كركوك
                </option>

            </select>

        </div>


        <div class="loading" id="loading">
            جاري تحميل حالة الطقس...
        </div>


        <div class="weather-main">

            <div>

                <div class="city-name" id="cityName">
                    بغداد
                </div>

                <div class="date" id="date">
                    --
                </div>

                <div class="temperature">
                    <span id="temperature">--</span>°C
                </div>

                <div class="condition" id="condition">
                    --
                </div>

            </div>


            <div class="weather-icon" id="weatherIcon">
                🌤️
            </div>

        </div>


        <div class="details">

            <div class="detail-card">

                <div class="detail-title">
                    💧 الرطوبة
                </div>

                <div class="detail-value">
                    <span id="humidity">--</span>%
                </div>

            </div>


            <div class="detail-card">

                <div class="detail-title">
                    💨 سرعة الرياح
                </div>

                <div class="detail-value">
                    <span id="wind">--</span> km/h
                </div>

            </div>


            <div class="detail-card">

                <div class="detail-title">
                    🌡️ الإحساس
                </div>

                <div class="detail-value">
                    <span id="feelsLike">--</span>°C
                </div>

            </div>

        </div>


        <div class="location-info" id="locationInfo">

            📍 تم تحديد موقعك

            <br><br>

            Latitude:
            <span id="latitude">--</span>

            <br>

            Longitude:
            <span id="longitude">--</span>

            <br>

            Accuracy:
            <span id="accuracy">--</span> meters

        </div>


        <div class="error" id="error">
        </div>

    </div>


    <footer>
        بيانات الطقس مقدمة بواسطة Open-Meteo
    </footer>

</div>


<script>

    const weatherDescriptions = {

        0: ["سماء صافية", "☀️"],
        1: ["غائم جزئياً", "🌤️"],
        2: ["غائم جزئياً", "⛅"],
        3: ["غائم", "☁️"],

        45: ["ضباب", "🌫️"],
        48: ["ضباب", "🌫️"],

        51: ["رذاذ خفيف", "🌦️"],
        53: ["رذاذ", "🌦️"],
        55: ["رذاذ كثيف", "🌧️"],

        61: ["أمطار خفيفة", "🌧️"],
        63: ["أمطار", "🌧️"],
        65: ["أمطار غزيرة", "🌧️"],

        71: ["ثلوج خفيفة", "🌨️"],
        73: ["ثلوج", "🌨️"],
        75: ["ثلوج غزيرة", "❄️"],

        80: ["زخات مطر", "🌦️"],
        81: ["زخات مطر", "🌧️"],
        82: ["زخات مطر قوية", "⛈️"],

        95: ["عاصفة رعدية", "⛈️"],
        96: ["عاصفة رعدية", "⛈️"],
        99: ["عاصفة رعدية", "⛈️"]

    };


    function showLoading(show) {

        document.getElementById("loading").style.display =
            show ? "block" : "none";

    }


    function showError(message) {

        const error = document.getElementById("error");

        error.innerText = message;

        error.style.display = "block";

    }


    function hideError() {

        document.getElementById("error").style.display = "none";

    }


    function formatDate() {

        const now = new Date();

        return now.toLocaleDateString("ar-IQ", {

            weekday: "long",

            year: "numeric",

            month: "long",

            day: "numeric"

        });

    }


    async function getWeather(latitude, longitude, cityName) {

        showLoading(true);

        hideError();

        try {

            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;

            const response = await fetch(url);

            if (!response.ok) {

                throw new Error("Weather API error");

            }

            const data = await response.json();

            const current = data.current;


            const weatherCode = current.weather_code;

            const weather =
                weatherDescriptions[weatherCode] ||
                ["حالة جوية غير معروفة", "🌤️"];


            document.getElementById("cityName").innerText =
                cityName;


            document.getElementById("date").innerText =
                formatDate();


            document.getElementById("temperature").innerText =
                Math.round(current.temperature_2m);


            document.getElementById("condition").innerText =
                weather[0];


            document.getElementById("weatherIcon").innerText =
                weather[1];


            document.getElementById("humidity").innerText =
                current.relative_humidity_2m;


            document.getElementById("wind").innerText =
                Math.round(current.wind_speed_10m);


            document.getElementById("feelsLike").innerText =
                Math.round(current.apparent_temperature);

        }

        catch (error) {

            showError(
                "حدث خطأ أثناء تحميل حالة الطقس. حاول مرة أخرى."
            );

        }

        finally {

            showLoading(false);

        }

    }


    function loadCityWeather() {

        const value =
            document.getElementById("citySelect").value;

        const parts = value.split(",");

        const latitude = parts[0];

        const longitude = parts[1];

        const englishName = parts[2];

        const arabicName = parts[3];

        getWeather(
            latitude,
            longitude,
            arabicName
        );

    }


    function getMyLocation() {

        hideError();

        if (!navigator.geolocation) {

            showError(
                "المتصفح لا يدعم تحديد الموقع."
            );

            return;

        }


        navigator.geolocation.getCurrentPosition(

            async function(position) {

                const latitude =
                    position.coords.latitude;

                const longitude =
                    position.coords.longitude;

                const accuracy =
                    position.coords.accuracy;


                document.getElementById("latitude")
                    .innerText =
                    latitude.toFixed(6);


                document.getElementById("longitude")
                    .innerText =
                    longitude.toFixed(6);


                document.getElementById("accuracy")
                    .innerText =
                    Math.round(accuracy);


                document.getElementById("locationInfo")
                    .style.display =
                    "block";


                getWeather(
                    latitude,
                    longitude,
                    "موقعك الحالي"
                );

            },


            function(error) {

                if (error.code === 1) {

                    showError(
                        "تم رفض صلاحية الموقع. اسمح للموقع بالوصول إلى موقعك من إعدادات المتصفح."
                    );

                }

                else if (error.code === 2) {

                    showError(
                        "تعذر تحديد موقعك."
                    );

                }

                else if (error.code === 3) {

                    showError(
                        "انتهى وقت محاولة تحديد الموقع."
                    );

                }

            },

            {

                enableHighAccuracy: true,

                timeout: 15000,

                maximumAge: 0

            }

        );

    }


    // تحميل طقس بغداد عند فتح الصفحة

    window.onload = function() {

        loadCityWeather();

    };

</script>

</body>
</html>
